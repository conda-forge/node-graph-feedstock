schema_version: 1

context:
  name: node-graph
  version: "0.6.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/node_graph-${{ version }}.tar.gz
  sha256: 25114f96e3154aeccac8faf75cde16e8acaf772e0cc34857d446c1145ae30cde

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.2
    - pip
  run:
    - typing_extensions
    - python-graphviz >=0.20
    - rdflib >=6.0
    - pydantic >=2.6,<3.dev0
    - wrapt
    - node-graph-widget
    - python >=${{ python_min }}
    - numpy
    - scipy
    - click >=8.1
    - pyyaml
    - colorama
    - termcolor
    - cloudpickle

tests:
  - python:
      imports:
        - node_graph
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Create node-based workflow
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/scinode/node-graph

extra:
  recipe-maintainers:
    - jan-janssen
